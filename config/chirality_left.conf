# Keyboard Identity
CONFIG_ZMK_KEYBOARD_NAME="Chirality"

# Display Settings
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Connectivity & Bluetooth
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
#CONFIG_BT_PRIVACY=n
#CONFIG_BT_CTLR_PRIVACY=n

# Encoder Support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Power & Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000
# Clock Control (Clone Board Stability)
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# System, Flash & Storage
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NONE=n

# Pointing Device (Mouse Keys)
CONFIG_ZMK_POINTING=y

# Logging & Debug
#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_SENSOR_LOG_LEVEL_DBG=y
